<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="fyn install: the main thread runs HTTP and dispatch for resolve, fetch and place; fs workers parse, untar and place files">
<rect width="1200" height="520" rx="16" fill="#f6f7f9"/>
<text x="60" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#1c2330" text-anchor="start">How a fyn install runs</text><text x="60" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#5a6474" text-anchor="start">Every win moved work off the main thread, or cut it</text><text x="60" y="214" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1c2330" text-anchor="start">main thread</text><text x="60" y="244" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#eb6834" text-anchor="start">the limit</text><text x="60" y="384" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1c2330" text-anchor="start">fs workers</text><text x="60" y="414" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#5a6474" text-anchor="start">cores − 1, max 8</text><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a93a2"/></marker></defs><rect x="230" y="170" width="354.40000000000003" height="96" rx="8" fill="#1c2330"/><text x="407.20000000000005" y="212" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">resolve</text><text x="407.20000000000005" y="244" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#c9d0db" text-anchor="middle">packument HTTP</text><rect x="230" y="340" width="354.40000000000003" height="96" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/><text x="407.20000000000005" y="382" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#1c2330" text-anchor="middle">unzip, parse,</text><text x="407.20000000000005" y="410" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#1c2330" text-anchor="middle">trim packuments</text><line x1="391.20000000000005" y1="274" x2="391.20000000000005" y2="332" stroke="#8a93a2" stroke-width="2" marker-end="url(#ar)"/><line x1="423.20000000000005" y1="332" x2="423.20000000000005" y2="274" stroke="#8a93a2" stroke-width="2" marker-end="url(#ar)"/><rect x="596.4000000000001" y="170" width="318.96" height="96" rx="8" fill="#1c2330"/><text x="755.8800000000001" y="212" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">fetch</text><text x="755.8800000000001" y="244" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#c9d0db" text-anchor="middle">tarball HTTP</text><rect x="596.4000000000001" y="340" width="318.96" height="96" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/><text x="755.8800000000001" y="382" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#1c2330" text-anchor="middle">verify, untar,</text><text x="755.8800000000001" y="410" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#1c2330" text-anchor="middle">write store entry</text><line x1="739.8800000000001" y1="274" x2="739.8800000000001" y2="332" stroke="#8a93a2" stroke-width="2" marker-end="url(#ar)"/><line x1="771.8800000000001" y1="332" x2="771.8800000000001" y2="274" stroke="#8a93a2" stroke-width="2" marker-end="url(#ar)"/><rect x="927.3600000000001" y="170" width="212.64" height="96" rx="8" fill="#1c2330"/><text x="1033.68" y="212" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">place</text><text x="1033.68" y="244" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#c9d0db" text-anchor="middle">dispatch jobs</text><rect x="927.3600000000001" y="340" width="212.64" height="96" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/><text x="1033.68" y="382" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#1c2330" text-anchor="middle">clone, link or</text><text x="1033.68" y="410" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#1c2330" text-anchor="middle">copy files</text><line x1="1017.6800000000001" y1="274" x2="1017.6800000000001" y2="332" stroke="#8a93a2" stroke-width="2" marker-end="url(#ar)"/><line x1="1049.68" y1="332" x2="1049.68" y2="274" stroke="#8a93a2" stroke-width="2" marker-end="url(#ar)"/><text x="230" y="480" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#5a6474" text-anchor="start">jobs go down, results come back up as one message each</text>
</svg>
