<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="On APFS clone is fastest and hardlink is slowest; one clone per package dir takes 0.61s against 4.85s to copy; on ext4 store + hardlink takes 2.49s against 8.70s for copy mode, which also skips the store">
<rect width="1200" height="800" rx="16" fill="#f6f7f9"/>
<text x="60" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#1c2330" text-anchor="start">Copy, hardlink or clone</text><text x="60" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#5a6474" text-anchor="start">Seconds, lower is faster. Each group has its own scale</text><text x="60" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1c2330" text-anchor="start">macOS APFS · place 7k files</text><text x="60" y="226" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#5a6474" text-anchor="start">copy</text><path d="M380,204 H744.8669950738916 Q748.8669950738916,204 748.8669950738916,208 V232 Q748.8669950738916,236 744.8669950738916,236 H380 Z" fill="#9aa1ab"/><text x="760.8669950738916" y="228" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="700" fill="#1c2330" text-anchor="start">0.70s</text><text x="1140" y="228" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#5a6474" text-anchor="end">138 MB disk</text><text x="60" y="276" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#5a6474" text-anchor="start">hardlink</text><path d="M380,254 H909.3333333333333 Q913.3333333333333,254 913.3333333333333,258 V282 Q913.3333333333333,286 909.3333333333333,286 H380 Z" fill="#9aa1ab"/><text x="925.3333333333333" y="278" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="700" fill="#1c2330" text-anchor="start">1.01s</text><text x="1140" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#5a6474" text-anchor="end">2.7 MB disk</text><text x="60" y="326" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#2a78d6" text-anchor="start">clone</text><path d="M380,304 H667.6256157635469 Q671.6256157635469,304 671.6256157635469,308 V332 Q671.6256157635469,336 667.6256157635469,336 H380 Z" fill="#2a78d6"/><text x="683.6256157635469" y="328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="700" fill="#1c2330" text-anchor="start">0.56s</text><text x="1140" y="328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#5a6474" text-anchor="end">2.3 MB disk</text><text x="60" y="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1c2330" text-anchor="start">macOS APFS · place 37.6k files</text><text x="60" y="446" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#5a6474" text-anchor="start">copy</text><path d="M380,424 H909.3333333333333 Q913.3333333333333,424 913.3333333333333,428 V452 Q913.3333333333333,456 909.3333333333333,456 H380 Z" fill="#9aa1ab"/><text x="925.3333333333333" y="448" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="700" fill="#1c2330" text-anchor="start">4.85s</text><text x="60" y="496" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#5a6474" text-anchor="start">clone each file</text><path d="M380,474 H725.6907216494845 Q729.6907216494845,474 729.6907216494845,478 V502 Q729.6907216494845,506 725.6907216494845,506 H380 Z" fill="#9aa1ab"/><text x="741.6907216494845" y="498" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="700" fill="#1c2330" text-anchor="start">3.18s</text><text x="60" y="546" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#2a78d6" text-anchor="start">clone each package dir</text><path d="M380,524 H443.0790378006873 Q447.0790378006873,524 447.0790378006873,528 V552 Q447.0790378006873,556 443.0790378006873,556 H380 Z" fill="#2a78d6"/><text x="459.0790378006873" y="548" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="700" fill="#1c2330" text-anchor="start">0.61s</text><text x="60" y="620" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1c2330" text-anchor="start">Linux ext4 · fyn warm-cache install</text><text x="60" y="666" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#5a6474" text-anchor="start">copy mode, no store</text><path d="M380,644 H909.3333333333333 Q913.3333333333333,644 913.3333333333333,648 V672 Q913.3333333333333,676 909.3333333333333,676 H380 Z" fill="#9aa1ab"/><text x="925.3333333333333" y="668" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="700" fill="#1c2330" text-anchor="start">8.70s</text><text x="60" y="716" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#2a78d6" text-anchor="start">store + hardlink</text><path d="M380,694 H528.6436781609195 Q532.6436781609195,694 532.6436781609195,698 V722 Q532.6436781609195,726 528.6436781609195,726 H380 Z" fill="#2a78d6"/><text x="544.6436781609195" y="718" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="700" fill="#1c2330" text-anchor="start