<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-label="On Linux, fyn in Node.js covers 54% of pnpm 12's clean-install gain over pnpm 11, and 73% on a warm cache">
