[package]
name = "fynjs-reflink"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Native copy-on-write file cloning for fyn"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi6"] }
napi-derive = "3"
rayon = "1"
reflink-copy = "0.1.30"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = "symbols"
codegen-units = 1
